name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # SA password for the ephemeral SQL Server service only (not a production secret).
    # MSSQL_* enables SqlServerTestConfiguration (other integration tests); keep password identical to the service.
    env:
      APPERTURE_CI_MSSQL_SA_PASSWORD: "AppertureCi_Governance55a!"
      MSSQL_SA_PASSWORD: "AppertureCi_Governance55a!"
      MSSQL_TEST_SERVER: "127.0.0.1,1433"
      APPERTURE_TEST_SFTP_HOST: "127.0.0.1"
      APPERTURE_TEST_SFTP_PORT: "2222"
      APPERTURE_TEST_SFTP_USERNAME: "apperture"
      APPERTURE_TEST_SFTP_PASSWORD: "AppertureSftp59a!"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.APPERTURE_CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
      sftp:
        image: atmoz/sftp:latest
        ports:
          - 2222:22
        volumes:
          - /tmp/apperture-sftp-upload:/home/apperture/upload
        options: >-
          --health-cmd "sh -c 'echo healthy'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        env:
          SFTP_USERS: "apperture:${{ env.APPERTURE_TEST_SFTP_PASSWORD }}:1001:100:upload"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port is open (attempt $i)"
              break
            fi
            echo "Waiting for SQL Server port... ($i/60)"
            sleep 2
          done
          # Allow time for SQL auth after the port accepts connections.
          sleep 8

      - name: Wait for SFTP
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              echo "SFTP port is open (attempt $i)"
              break
            fi
            echo "Waiting for SFTP port... ($i/60)"
            sleep 2
          done

      - name: Restore
        run: dotnet restore Apperture.slnx

      - name: Build
        run: dotnet build Apperture.slnx -c Release --no-restore

      # Proof that no SQL Server test can pass without SQL Server: runs the IntegrationTests assembly of the Release build above against
      # an unreachable target, with every APPERTURE_*/MSSQL_* variable removed from the test process, so it uses no live credential.
      # It reuses that build (-NoBuild) and refuses a result whose binary is older than the source or whose tree is not HEAD.
      # No -Record: that mode never passes. Pinned by SqlHonestyCiGuardTests.
      - name: SQL execution honesty
        id: sql-honesty
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/dev/Test-SqlExecutionHonesty.ps1 -Configuration Release -NoBuild -OutputDirectory artifacts/sql-execution-honesty

      # The JSON report only (a few kilobytes): no logs, TRX or binaries.
      - name: Upload SQL execution honesty report
        if: failure() && steps.sql-honesty.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: sql-execution-honesty-report
          path: artifacts/sql-execution-honesty/sql-honesty-report.json
          if-no-files-found: ignore

      - name: Test
        env:
          APPERTURE_TEST_SQL: ${{ format('Server=127.0.0.1,1433;User Id=sa;Password={0};TrustServerCertificate=True;Initial Catalog=Apperture_ManagementGovernanceTests;', env.APPERTURE_CI_MSSQL_SA_PASSWORD) }}
        run: dotnet test Apperture.slnx -c Release --no-build --verbosity normal

  # Stable check name for branch protection: "browser-security".
  # I-2 / SEC-1B4: the opt-in Playwright suite is a blocking gate, not part of `dotnet test Apperture.slnx`.
  browser-security:
    name: browser-security
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPERTURE_CI_MSSQL_SA_PASSWORD: "AppertureCi_Governance55a!"
      APPERTURE_BROWSER_TESTS: "1"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ env.APPERTURE_CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null; then
              echo "SQL Server port is open (attempt $i)"
              break
            fi
            echo "Waiting for SQL Server port... ($i/60)"
            sleep 2
          done
          sleep 8

      - name: Restore
        run: dotnet restore tests/Apperture.BrowserTests/Apperture.BrowserTests.csproj

      - name: Build
        run: dotnet build tests/Apperture.BrowserTests/Apperture.BrowserTests.csproj -c Release --no-restore

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.63.0

      - name: Install Playwright browsers
        run: pwsh tests/Apperture.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium firefox webkit

      - name: Browser security suite
        env:
          APPERTURE_TEST_SQL_CONNECTION_STRING: ${{ format('Server=127.0.0.1,1433;User Id=sa;Password={0};TrustServerCertificate=True;Initial Catalog=Apperture;', env.APPERTURE_CI_MSSQL_SA_PASSWORD) }}
        run: >
          dotnet test tests/Apperture.BrowserTests/Apperture.BrowserTests.csproj
          -c Release --no-build --verbosity normal
          --logger "trx;LogFileName=browser-security.trx"
          --results-directory artifacts/browser-security

      - name: Upload browser-security results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-security-results
          path: artifacts/browser-security
          if-no-files-found: ignore
