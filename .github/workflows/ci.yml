name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Apperture.slnx

      - name: Build
        run: dotnet build Apperture.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Apperture.slnx -c Release --no-build --verbosity normal
