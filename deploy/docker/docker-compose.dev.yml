# Dev stack — add services (API, UI, DB, etc.) here.
# Included from repo root via docker-compose.yml.
#
# SQL Server: start with `docker compose up -d` from repo root.
# Connection string: Server=localhost,1433;Database=Apperture;User Id=sa;Password=<SA_PASSWORD>;TrustServerCertificate=True;
# .env is generated by scripts/dev/Sync-EnvFromUserSecrets.ps1 from User Secrets (single source of truth).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: apperture-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  sqlserver-data:
